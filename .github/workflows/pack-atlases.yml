name: Pack Unciv image atlases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-atlases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Unciv
        run: |
          curl -fL https://github.com/yairm210/Unciv/releases/latest/download/Unciv.jar -o Unciv.jar

      - name: Pack mod atlases
        run: |
          java -jar Unciv.jar mod-ci
          test -s game.atlas
          test -s game.png
          grep -q 'LeaderIcons/Sultan Mahmud Shah' game.atlas
          grep -q 'NationIcons/Kesultanan Melaka' game.atlas

      - name: Commit generated atlas files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Images* Atlases.json game*.png game*.atlas
          if git diff --cached --quiet; then
            echo "No generated atlas changes to commit."
          else
            git commit -m "Generate Unciv texture atlases"
            git push origin HEAD:main
          fi
